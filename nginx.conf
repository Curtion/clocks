server {
    listen 80;
    server_name _;

    # baseURL 为 /clocks/, 资源链接都带 /clocks/ 前缀
    # alias 把 /clocks/* 映射到 nginx 根目录下的文件
    location /clocks/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ $uri.html =404;
    }

    # 根路径访问重定向到 /clocks/, 用户体验更友好
    location = / {
        return 302 /clocks/;
    }
}
