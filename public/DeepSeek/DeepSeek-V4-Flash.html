<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟时钟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: Arial, sans-serif;
    }

    .clock-container {
      position: relative;
    }

    canvas {
      display: block;
      background: #1a1a2e;
      border-radius: 50%;
      box-shadow:
        0 0 0 8px #16213e,
        0 0 0 12px #0f3460,
        0 0 60px rgba(15, 52, 96, 0.6),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
    }

    /* 数字时间显示 */
    .digital-time {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      color: #e94560;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <canvas id="clock" width="400" height="400"></canvas>
    <div class="digital-time" id="digital"></div>
  </div>

  <script>
    const canvas = document.getElementById('clock');
    const ctx = canvas.getContext('2d');
    const digital = document.getElementById('digital');

    const size = 400;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius = size / 2 - 20;

    function drawClock() {
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const millis = now.getMilliseconds();

      // 平滑秒针（带过渡）
      const smoothSeconds = seconds + millis / 1000;
      const smoothMinutes = minutes + smoothSeconds / 60;
      const smoothHours = hours + smoothMinutes / 60;

      // 清空画布
      ctx.clearRect(0, 0, size, size);

      // --- 表盘 ---
      ctx.save();
      ctx.translate(centerX, centerY);

      // 外圈
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#e94560';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 内圈装饰
      ctx.beginPath();
      ctx.arc(0, 0, radius - 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(233, 69, 96, 0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // --- 刻度 ---
      for (let i = 0; i < 60; i++) {
        const angle = (i * Math.PI * 2) / 60 - Math.PI / 2;
        const isHour = i % 5 === 0;
        const len = isHour ? 18 : 8;
        const outer = radius - (isHour ? 22 : 14);
        const inner = outer - len;

        const x1 = Math.cos(angle) * outer;
        const y1 = Math.sin(angle) * outer;
        const x2 = Math.cos(angle) * inner;
        const y2 = Math.sin(angle) * inner;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = isHour ? '#ffffff' : 'rgba(255,255,255,0.4)';
        ctx.lineWidth = isHour ? 3 : 1.5;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // --- 数字 ---
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 1; i <= 12; i++) {
        const angle = (i * Math.PI * 2) / 12 - Math.PI / 2;
        const numRadius = radius - 40;
        const x = Math.cos(angle) * numRadius;
        const y = Math.sin(angle) * numRadius;
        ctx.fillText(i.toString(), x, y);
      }

      // --- 时针 ---
      drawHand(smoothHours * 30 * Math.PI / 180, radius * 0.5, 6, '#ffffff');

      // --- 分针 ---
      drawHand(smoothMinutes * 6 * Math.PI / 180, radius * 0.7, 4, '#e0e0e0');

      // --- 秒针 ---
      drawHand(smoothSeconds * 6 * Math.PI / 180, radius * 0.82, 2, '#e94560');

      // --- 中心圆点 ---
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#e94560';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 中心小点
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.restore();

      // --- 数字时间 ---
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      digital.textContent = `${hh}:${mm}:${ss}`;

      requestAnimationFrame(drawClock);
    }

    function drawHand(angle, length, width, color) {
      ctx.save();
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 12);
      ctx.lineTo(0, -length);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    }

    drawClock();
  </script>
</body>
</html>
