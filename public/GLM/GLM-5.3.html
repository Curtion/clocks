<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模拟时钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
    font-family: sans-serif;
  }

  .clock {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, #f5f5f5 0%, #e0e0e0 100%);
    border: 8px solid #333;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }

  /* 刻度 */
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 152px;
    margin-left: -2px;
    margin-top: -152px;
    transform-origin: 50% 152px;
  }
  .tick::before {
    content: "";
    display: block;
    width: 4px;
    height: 12px;
    background: #333;
    border-radius: 2px;
  }
  .tick.major::before {
    width: 6px;
    height: 18px;
    background: #111;
  }

  /* 指针 */
  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
  }
  .hour {
    width: 8px;
    height: 80px;
    margin: -80px 0 0 -4px;
    background: #222;
  }
  .minute {
    width: 6px;
    height: 120px;
    margin: -120px 0 0 -3px;
    background: #444;
  }
  .second {
    width: 2px;
    height: 135px;
    margin: -135px 0 0 -1px;
    background: #d40000;
  }

  /* 中心圆点 */
  .center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    margin: -8px 0 0 -8px;
    background: #d40000;
    border: 3px solid #222;
    border-radius: 50%;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="clock" id="clock">
  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>
  <div class="center"></div>
</div>

<script>
  // 生成 60 个刻度，每 5 个为加粗主刻度
  const clock = document.getElementById('clock');
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (i % 5 === 0 ? ' major' : '');
    tick.style.transform = `rotate(${i * 6}deg)`;
    clock.appendChild(tick);
  }

  const hourHand = document.getElementById('hour');
  const minuteHand = document.getElementById('minute');
  const secondHand = document.getElementById('second');

  function update() {
    const now = new Date();
    const s = now.getSeconds() + now.getMilliseconds() / 1000;
    const m = now.getMinutes() + s / 60;
    const h = now.getHours() % 12 + m / 60;

    secondHand.style.transform = `rotate(${s * 6}deg)`;
    minuteHand.style.transform = `rotate(${m * 6}deg)`;
    hourHand.style.transform = `rotate(${h * 30}deg)`;

    requestAnimationFrame(update);
  }
  update();
</script>

</body>
</html>
