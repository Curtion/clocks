<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>模拟时钟</title>
	<style>
		:root {
			color-scheme: dark;
			--bg-1: #08121f;
			--bg-2: #13263d;
			--ring: rgba(255, 255, 255, 0.14);
			--face: rgba(8, 18, 31, 0.78);
			--tick: rgba(226, 241, 255, 0.9);
			--hand-hour: #f7fbff;
			--hand-minute: #8ae6ff;
			--hand-second: #ff6f91;
			--shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
			background:
				radial-gradient(circle at 25% 20%, rgba(104, 193, 255, 0.28), transparent 30%),
				radial-gradient(circle at 75% 80%, rgba(255, 111, 145, 0.22), transparent 26%),
				linear-gradient(160deg, var(--bg-1), var(--bg-2));
			overflow: hidden;
		}

		body::before,
		body::after {
			content: "";
			position: fixed;
			inset: auto;
			width: 42vmax;
			height: 42vmax;
			border-radius: 50%;
			filter: blur(80px);
			opacity: 0.28;
			pointer-events: none;
		}

		body::before {
			top: -12vmax;
			left: -8vmax;
			background: #59b8ff;
		}

		body::after {
			right: -10vmax;
			bottom: -14vmax;
			background: #ff6f91;
		}

		.clock {
			position: relative;
			width: min(78vmin, 420px);
			aspect-ratio: 1;
			border-radius: 50%;
			display: grid;
			place-items: center;
			background:
				radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.06), transparent 32%),
				radial-gradient(circle at 50% 50%, var(--face) 0 58%, rgba(255, 255, 255, 0.03) 59%, rgba(255, 255, 255, 0.01) 100%);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: var(--shadow);
			isolation: isolate;
		}

		.clock::before {
			content: "";
			position: absolute;
			inset: 5.5%;
			border-radius: 50%;
			border: 1px solid var(--ring);
			box-shadow:
				inset 0 0 0 1px rgba(255, 255, 255, 0.03),
				inset 0 16px 40px rgba(255, 255, 255, 0.04),
				inset 0 -16px 40px rgba(0, 0, 0, 0.34);
		}

		.clock::after {
			content: "";
			position: absolute;
			inset: 10.5%;
			border-radius: 50%;
			border: 1px dashed rgba(255, 255, 255, 0.05);
		}

		.ticks,
		.numbers,
		.hands {
			position: absolute;
			inset: 0;
			border-radius: 50%;
		}

		.tick {
			position: absolute;
			top: 4.5%;
			left: 50%;
			width: 2px;
			height: 11%;
			margin-left: -1px;
			transform-origin: 50% 410%;
		}

		.tick::before {
			content: "";
			display: block;
			width: 100%;
			height: 100%;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.24);
			transform: scaleY(0.52);
			transform-origin: top center;
		}

		.tick.major::before {
			background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(138, 230, 255, 0.6));
			transform: scaleY(0.86);
		}

		.number {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 100%;
			height: 100%;
			font-size: clamp(18px, 4.1vmin, 25px);
			font-weight: 600;
			color: rgba(238, 248, 255, 0.92);
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
		}

		.number span {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
		}

		.hand {
			position: absolute;
			left: 50%;
			bottom: 50%;
			transform-origin: 50% 100%;
			border-radius: 999px;
			filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.28));
		}

		.hand.hour {
			width: 10px;
			height: 23%;
			margin-left: -5px;
			background: linear-gradient(180deg, var(--hand-hour), rgba(247, 251, 255, 0.55));
		}

		.hand.minute {
			width: 6px;
			height: 31%;
			margin-left: -3px;
			background: linear-gradient(180deg, var(--hand-minute), rgba(138, 230, 255, 0.5));
		}

		.hand.second {
			width: 3px;
			height: 35%;
			margin-left: -1.5px;
			background: linear-gradient(180deg, var(--hand-second), rgba(255, 111, 145, 0.38));
		}

		.hand.second::after {
			content: "";
			position: absolute;
			left: 50%;
			bottom: -18%;
			width: 3px;
			height: 26%;
			margin-left: -1.5px;
			border-radius: inherit;
			background: rgba(255, 111, 145, 0.8);
		}

		.center-dot {
			position: absolute;
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: radial-gradient(circle at 35% 35%, #ffffff 0 28%, #ff6f91 29% 62%, #66152b 63% 100%);
			box-shadow:
				0 0 0 4px rgba(9, 20, 33, 0.85),
				0 0 18px rgba(255, 111, 145, 0.45);
			z-index: 2;
		}

		.digital {
			position: absolute;
			bottom: 18%;
			left: 50%;
			transform: translateX(-50%);
			padding: 8px 16px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 255, 255, 0.08);
			color: rgba(241, 249, 255, 0.9);
			font-size: clamp(12px, 2.5vmin, 15px);
			letter-spacing: 0.22em;
			text-indent: 0.22em;
			backdrop-filter: blur(12px);
		}

		@media (max-width: 480px) {
			.clock {
				width: min(86vmin, 360px);
			}

			.digital {
				bottom: 16%;
			}
		}
	</style>
</head>
<body>
	<div class="clock" aria-label="显示当前时间的模拟时钟" role="img">
		<div class="ticks" aria-hidden="true"></div>
		<div class="numbers" aria-hidden="true"></div>
		<div class="hands" aria-hidden="true">
			<div class="hand hour" id="hour-hand"></div>
			<div class="hand minute" id="minute-hand"></div>
			<div class="hand second" id="second-hand"></div>
		</div>
		<div class="center-dot" aria-hidden="true"></div>
		<div class="digital" id="digital-time">00:00:00</div>
	</div>

	<script>
		const ticks = document.querySelector('.ticks');
		const numbers = document.querySelector('.numbers');
		const hourHand = document.getElementById('hour-hand');
		const minuteHand = document.getElementById('minute-hand');
		const secondHand = document.getElementById('second-hand');
		const digitalTime = document.getElementById('digital-time');

		for (let index = 0; index < 60; index += 1) {
			const tick = document.createElement('div');
			tick.className = index % 5 === 0 ? 'tick major' : 'tick';
			tick.style.transform = `rotate(${index * 6}deg)`;
			ticks.appendChild(tick);
		}

		for (let number = 1; number <= 12; number += 1) {
			const marker = document.createElement('div');
			const angle = number * 30;
			const radius = 37;
			const x = Math.sin(angle * Math.PI / 180) * radius;
			const y = -Math.cos(angle * Math.PI / 180) * radius;

			marker.className = 'number';
			marker.style.transform = `translate(-50%, -50%) translate(${x}%, ${y}%)`;
			marker.innerHTML = `<span>${number}</span>`;
			numbers.appendChild(marker);
		}

		function updateClock() {
			const now = new Date();
			const milliseconds = now.getMilliseconds();
			const seconds = now.getSeconds() + milliseconds / 1000;
			const minutes = now.getMinutes() + seconds / 60;
			const hours = (now.getHours() % 12) + minutes / 60;

			hourHand.style.transform = `rotate(${hours * 30}deg)`;
			minuteHand.style.transform = `rotate(${minutes * 6}deg)`;
			secondHand.style.transform = `rotate(${seconds * 6}deg)`;

			const timeText = now.toLocaleTimeString('zh-CN', {
				hour12: false,
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit'
			});

			digitalTime.textContent = timeText;
			requestAnimationFrame(updateClock);
		}

		updateClock();
	</script>
</body>
</html>
