<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟时钟</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.22), transparent 34%),
        radial-gradient(circle at 75% 75%, rgba(14, 165, 233, 0.2), transparent 36%),
        linear-gradient(135deg, #eef2ff, #f8fafc 45%, #e0f2fe);
    }

    .clock-wrap {
      display: grid;
      place-items: center;
      gap: 24px;
      padding: 32px;
    }

    .clock {
      --clock-size: min(78vw, 420px);
      --number-radius: calc(var(--clock-size) / 2 - 58px);
      position: relative;
      width: var(--clock-size);
      aspect-ratio: 1;
      border: 14px solid rgba(255, 255, 255, 0.76);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #ffffff 0 4%, transparent 4.3%),
        radial-gradient(circle at 50% 50%, #f8fafc 0 58%, #e2e8f0 100%);
      box-shadow:
        0 28px 70px rgba(15, 23, 42, 0.18),
        inset 0 0 0 1px rgba(15, 23, 42, 0.08),
        inset 0 10px 28px rgba(255, 255, 255, 0.72),
        inset 0 -18px 40px rgba(15, 23, 42, 0.08);
    }

    .tick {
      position: absolute;
      inset: 18px;
      z-index: 1;
      transform: rotate(var(--angle));
    }

    .tick::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 11px;
      border-radius: 999px;
      background: rgba(71, 85, 105, 0.55);
      transform: translateX(-50%);
    }

    .tick.hour::before {
      width: 4px;
      height: 18px;
      background: rgba(15, 23, 42, 0.78);
    }

    .number {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #0f172a;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 700;
      z-index: 2;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--number-radius) * -1)) rotate(calc(var(--angle) * -1));
      user-select: none;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      border-radius: 999px;
      transform: translateX(-50%) rotate(var(--rotation));
      transform-origin: 50% 100%;
      will-change: transform;
      z-index: 4;
    }

    .hour-hand {
      width: 9px;
      height: 27%;
      background: #0f172a;
      box-shadow: 0 0 8px rgba(15, 23, 42, 0.22);
    }

    .minute-hand {
      width: 6px;
      height: 38%;
      background: #334155;
      box-shadow: 0 0 8px rgba(51, 65, 85, 0.18);
    }

    .second-hand {
      width: 2px;
      height: 43%;
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.34);
    }

    .second-hand::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -18%;
      width: 2px;
      height: 18%;
      border-radius: 999px;
      background: #ef4444;
      transform: translateX(-50%);
    }

    .pin {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border: 4px solid #ffffff;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.24);
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    .digital-time {
      min-width: 190px;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.52);
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1);
      color: #0f172a;
      font-size: clamp(20px, 5vw, 30px);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      backdrop-filter: blur(14px);
    }

    @media (max-width: 480px) {
      .clock-wrap {
        gap: 18px;
        padding: 20px;
      }

      .clock {
        --clock-size: min(86vw, 360px);
        border-width: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="clock-wrap" aria-label="当前时间模拟时钟">
    <div class="clock" id="clock" aria-hidden="true">
      <div class="hand hour-hand" id="hourHand"></div>
      <div class="hand minute-hand" id="minuteHand"></div>
      <div class="hand second-hand" id="secondHand"></div>
      <div class="pin"></div>
    </div>
    <div class="digital-time" id="digitalTime" aria-live="polite">00:00:00</div>
  </main>

  <script>
    const clock = document.getElementById('clock');
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');
    const digitalTime = document.getElementById('digitalTime');

    function buildClockFace() {
      for (let i = 0; i < 60; i += 1) {
        const tick = document.createElement('span');
        tick.className = `tick${i % 5 === 0 ? ' hour' : ''}`;
        tick.style.setProperty('--angle', `${i * 6}deg`);
        clock.appendChild(tick);
      }

      for (let i = 1; i <= 12; i += 1) {
        const number = document.createElement('span');
        number.className = 'number';
        number.textContent = i;
        number.style.setProperty('--angle', `${i * 30}deg`);
        clock.appendChild(number);
      }
    }

    function twoDigits(value) {
      return String(value).padStart(2, '0');
    }

    function updateClock() {
      const now = new Date();
      const milliseconds = now.getMilliseconds();
      const seconds = now.getSeconds() + milliseconds / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      hourHand.style.setProperty('--rotation', `${hours * 30}deg`);
      minuteHand.style.setProperty('--rotation', `${minutes * 6}deg`);
      secondHand.style.setProperty('--rotation', `${seconds * 6}deg`);

      digitalTime.textContent = [
        twoDigits(now.getHours()),
        twoDigits(now.getMinutes()),
        twoDigits(now.getSeconds())
      ].join(':');

      requestAnimationFrame(updateClock);
    }

    buildClockFace();
    updateClock();
  </script>
</body>
</html>
