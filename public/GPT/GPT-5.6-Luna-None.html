<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟时钟</title>
  <style>
    :root {
      color-scheme: dark;
      --clock-size: min(78vw, 78vh, 420px);
      --face: #f7f1df;
      --ink: #1d2733;
      --accent: #d94f4f;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at center, #26364a, #101820 72%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .clock {
      position: relative;
      width: var(--clock-size);
      aspect-ratio: 1;
      border: clamp(8px, 2vw, 14px) solid #26313d;
      border-radius: 50%;
      background: var(--face);
      box-shadow: 0 0 0 clamp(3px, .8vw, 6px) #718092, 0 22px 55px #0008,
        inset 0 0 25px #0003;
    }

    .tick {
      position: absolute;
      inset: 4%;
      transform: rotate(calc(var(--i) * 30deg));
    }

    .tick::before {
      content: "";
      display: block;
      width: 3px;
      height: 8%;
      margin: 0 auto;
      border-radius: 2px;
      background: var(--ink);
      transform-origin: center calc(var(--clock-size) * .46);
    }

    .tick.major::before {
      width: 5px;
      height: 11%;
    }

    .number {
      position: absolute;
      color: var(--ink);
      font: 700 clamp(18px, 4vw, 28px)/1 Georgia, serif;
      transform: translate(-50%, -50%);
    }

    .n12 { left: 50%; top: 9%; }
    .n3 { left: 91%; top: 50%; }
    .n6 { left: 50%; top: 91%; }
    .n9 { left: 9%; top: 50%; }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      width: var(--width);
      height: var(--height);
      border-radius: 999px;
      background: var(--color);
      transform: translateX(-50%) rotate(var(--angle));
      transform-origin: 50% 100%;
      box-shadow: 0 2px 3px #0003;
    }

    .hour { --width: 7px; --height: 25%; --color: var(--ink); }
    .minute { --width: 5px; --height: 35%; --color: var(--ink); }
    .second { --width: 2px; --height: 39%; --color: var(--accent); }

    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      border: 4px solid var(--face);
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px var(--ink);
    }

    .date {
      position: absolute;
      left: 50%;
      bottom: 22%;
      padding: 3px 8px;
      border: 1px solid #1d273355;
      border-radius: 3px;
      color: var(--ink);
      font-size: clamp(10px, 2vw, 13px);
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <main class="clock" aria-label="显示当前时间的模拟时钟">
    <span class="tick major" style="--i: 0"></span>
    <span class="tick" style="--i: 1"></span>
    <span class="tick" style="--i: 2"></span>
    <span class="tick major" style="--i: 3"></span>
    <span class="tick" style="--i: 4"></span>
    <span class="tick" style="--i: 5"></span>
    <span class="tick major" style="--i: 6"></span>
    <span class="tick" style="--i: 7"></span>
    <span class="tick" style="--i: 8"></span>
    <span class="tick major" style="--i: 9"></span>
    <span class="tick" style="--i: 10"></span>
    <span class="tick" style="--i: 11"></span>

    <span class="number n12">12</span>
    <span class="number n3">3</span>
    <span class="number n6">6</span>
    <span class="number n9">9</span>
    <span class="hand hour" id="hour"></span>
    <span class="hand minute" id="minute"></span>
    <span class="hand second" id="second"></span>
    <span class="pin"></span>
    <time class="date" id="date"></time>
  </main>

  <script>
    const hour = document.getElementById('hour');
    const minute = document.getElementById('minute');
    const second = document.getElementById('second');
    const date = document.getElementById('date');

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      hour.style.setProperty('--angle', `${hours * 30}deg`);
      minute.style.setProperty('--angle', `${minutes * 6}deg`);
      second.style.setProperty('--angle', `${seconds * 6}deg`);
      date.textContent = new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(now);

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
