<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟时钟</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --dial: #f8fafc;
      --dial-border: #334155;
      --hour: #0f172a;
      --minute: #1e293b;
      --second: #ef4444;
      --center: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .clock {
      position: relative;
      width: min(82vw, 360px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #e2e8f0 70%, #cbd5e1);
      border: 12px solid var(--dial-border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35), inset 0 0 0 10px rgba(255,255,255,0.35);
    }

    .clock::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 2px solid rgba(15, 23, 42, 0.16);
      pointer-events: none;
    }

    .mark {
      position: absolute;
      left: 50%;
      top: 0;
      width: 4px;
      height: 100%;
      transform-origin: center center;
    }

    .mark::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 4%;
      width: 100%;
      height: 10px;
      transform: translateX(-50%);
      background: #475569;
      border-radius: 999px;
    }

    .hour-mark::before {
      height: 18px;
      background: #0f172a;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: center bottom;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--hour);
    }

    .hour {
      width: 10px;
      height: 95px;
      background: var(--hour);
    }

    .minute {
      width: 7px;
      height: 125px;
      background: var(--minute);
    }

    .second {
      width: 3px;
      height: 140px;
      background: var(--second);
    }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--center);
      box-shadow: 0 0 0 6px rgba(15, 23, 42, 0.08);
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="clock" id="clock">
    <div class="center"></div>
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
  </div>

  <script>
    const clock = document.getElementById('clock');
    const hourHand = document.getElementById('hour');
    const minuteHand = document.getElementById('minute');
    const secondHand = document.getElementById('second');

    for (let i = 0; i < 60; i += 1) {
      const mark = document.createElement('div');
      mark.className = 'mark';
      mark.style.transform = `rotate(${i * 6}deg)`;
      if (i % 5 === 0) {
        mark.classList.add('hour-mark');
      }
      clock.insertBefore(mark, clock.firstChild);
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const hourAngle = (hours * 30) + (minutes * 0.5);
      const minuteAngle = minutes * 6;
      const secondAngle = seconds * 6;

      hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
      secondHand.style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
