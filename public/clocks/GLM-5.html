<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟时钟</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --clock-face: #1a1a24;
            --clock-border: #c9a227;
            --clock-border-dark: #8b7019;
            --hour-hand: #e8d5a3;
            --minute-hand: #c9a227;
            --second-hand: #ff4757;
            --marker-primary: #e8d5a3;
            --marker-secondary: #5a5a6e;
            --center-dot: #c9a227;
            --shadow-color: rgba(201, 162, 39, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* 背景装饰 */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .background::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--shadow-color) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        .background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 71, 87, 0.02) 0%, transparent 50%);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* 时钟容器 */
        .clock-container {
            position: relative;
            z-index: 1;
        }

        .clock {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: var(--clock-face);
            position: relative;
            box-shadow: 
                0 0 0 12px var(--clock-border),
                0 0 0 14px var(--clock-border-dark),
                0 0 60px var(--shadow-color),
                inset 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* 内圈装饰 */
        .clock::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border-radius: 50%;
            border: 1px solid rgba(201, 162, 39, 0.2);
        }

        /* 刻度 */
        .marker {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        .marker::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: var(--marker-secondary);
        }

        .marker.hour-marker::before {
            width: 3px;
            height: 16px;
            top: 18px;
            background: var(--marker-primary);
            border-radius: 2px;
        }

        .marker.minute-marker::before {
            width: 1px;
            height: 8px;
            top: 22px;
            background: var(--marker-secondary);
        }

        /* 数字 */
        .number {
            position: absolute;
            font-size: 20px;
            font-weight: 600;
            color: var(--marker-primary);
            text-align: center;
            width: 40px;
            height: 40px;
            line-height: 40px;
            transform: translate(-50%, -50%);
        }

        /* 指针 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.3, 1);
        }

        .hour-hand {
            width: 6px;
            height: 70px;
            margin-left: -3px;
            background: linear-gradient(to top, var(--hour-hand), #f5ecd3);
            box-shadow: 0 0 10px rgba(232, 213, 163, 0.3);
            z-index: 3;
        }

        .minute-hand {
            width: 4px;
            height: 100px;
            margin-left: -2px;
            background: linear-gradient(to top, var(--minute-hand), #e8d5a3);
            box-shadow: 0 0 8px rgba(201, 162, 39, 0.4);
            z-index: 2;
        }

        .second-hand {
            width: 2px;
            height: 120px;
            margin-left: -1px;
            background: var(--second-hand);
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.5);
            z-index: 4;
            transition: none;
        }

        .second-hand::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: var(--second-hand);
            border-radius: 2px;
        }

        /* 中心点 */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #f5ecd3, var(--center-dot));
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 15px rgba(201, 162, 39, 0.6);
        }

        .center-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: var(--second-hand);
            border-radius: 50%;
        }

        /* 数字时间显示 */
        .digital-time {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            color: var(--marker-secondary);
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        /* 品牌文字 */
        .brand {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 600;
            color: var(--marker-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .clock {
                width: 280px;
                height: 280px;
            }
            .hour-hand {
                height: 60px;
            }
            .minute-hand {
                height: 85px;
            }
            .second-hand {
                height: 100px;
            }
            .number {
                font-size: 16px;
            }
        }

        /* 减少动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            .background::before {
                animation: none;
            }
            .hand {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    
    <div class="clock-container">
        <div class="clock">
            <div class="brand">Precision</div>
            
            <!-- 刻度将由JS生成 -->
            <div class="markers"></div>
            
            <!-- 数字 -->
            <div class="number" style="top: 15%; left: 50%;">12</div>
            <div class="number" style="top: 50%; left: 85%;">3</div>
            <div class="number" style="top: 85%; left: 50%;">6</div>
            <div class="number" style="top: 50%; left: 15%;">9</div>
            
            <!-- 指针 -->
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            
            <!-- 中心点 -->
            <div class="center-dot"></div>
            
            <!-- 数字时间 -->
            <div class="digital-time" id="digitalTime">00:00:00</div>
        </div>
    </div>

    <script>
        // 生成刻度
        function createMarkers() {
            const markersContainer = document.querySelector('.markers');
            
            for (let i = 0; i < 60; i++) {
                const marker = document.createElement('div');
                marker.className = i % 5 === 0 ? 'marker hour-marker' : 'marker minute-marker';
                marker.style.transform = `rotate(${i * 6}deg)`;
                markersContainer.appendChild(marker);
            }
        }

        // 更新时钟
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // 计算角度（平滑移动）
            const secondDeg = (seconds * 6) + (milliseconds * 0.006);
            const minuteDeg = (minutes * 6) + (seconds * 0.1);
            const hourDeg = (hours % 12) * 30 + (minutes * 0.5);

            // 应用旋转
            document.getElementById('secondHand').style.transform = `rotate(${secondDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minuteDeg}deg)`;
            document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;

            // 更新数字时间
            const timeString = [
                hours.toString().padStart(2, '0'),
                minutes.toString().padStart(2, '0'),
                seconds.toString().padStart(2, '0')
            ].join(':');
            document.getElementById('digitalTime').textContent = timeString;
        }

        // 初始化
        createMarkers();
        updateClock();

        // 每16ms更新一次（约60fps，实现秒针平滑移动）
        setInterval(updateClock, 16);
    </script>
</body>
</html>
