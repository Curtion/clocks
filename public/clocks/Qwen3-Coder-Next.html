<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟时钟</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: sans-serif;
        }

        .clock {
            width: 300px;
            height: 300px;
            border: 15px solid #ecf0f1;
            border-radius: 50%;
            position: relative;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .center-point {
            width: 15px;
            height: 15px;
            background-color: #34495e;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 5px;
            z-index: 5;
        }

        .hour {
            width: 8px;
            height: 70px;
            background-color: #34495e;
        }

        .minute {
            width: 6px;
            height: 100px;
            background-color: #e74c3c;
        }

        .second {
            width: 3px;
            height: 120px;
            background-color: #f1c40f;
            z-index: 6;
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #34495e;
        }

        .number span {
            display: block;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="clock">
        <div class="center-point"></div>
        <div class="hand hour" id="hour-hand"></div>
        <div class="hand minute" id="minute-hand"></div>
        <div class="hand second" id="second-hand"></div>
        
        <!-- 时钟数字标记 -->
        <div class="number" style="transform: rotate(0deg);"><span>12</span></div>
        <div class="number" style="transform: rotate(30deg);"><span>1</span></div>
        <div class="number" style="transform: rotate(60deg);"><span>2</span></div>
        <div class="number" style="transform: rotate(90deg);"><span>3</span></div>
        <div class="number" style="transform: rotate(120deg);"><span>4</span></div>
        <div class="number" style="transform: rotate(150deg);"><span>5</span></div>
        <div class="number" style="transform: rotate(180deg);"><span>6</span></div>
        <div class="number" style="transform: rotate(210deg);"><span>7</span></div>
        <div class="number" style="transform: rotate(240deg);"><span>8</span></div>
        <div class="number" style="transform: rotate(270deg);"><span>9</span></div>
        <div class="number" style="transform: rotate(300deg);"><span>10</span></div>
        <div class="number" style="transform: rotate(330deg);"><span>11</span></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // 获取当前时间
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();
            
            // 计算时针、分针和秒针的角度
            // 秒针：每秒6度 (360度/60秒)
            const secondDegrees = ((seconds / 60) * 360);
            
            // 分针：每分钟6度 + 秒针影响的微小调整
            const minuteDegrees = ((minutes / 60) * 360) + ((seconds/60)*6);
            
            // 时针：每小时30度 + 分针影响的微小调整
            const hourDegrees = ((hours / 12) * 360) + ((minutes/60)*30);
            
            // 应用旋转角度
            document.getElementById('second-hand').style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById('minute-hand').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('hour-hand').style.transform = `rotate(${hourDegrees}deg)`;
        }
        
        // 初始化时钟
        updateClock();
        
        // 每秒更新一次时钟
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
