<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟时钟</title>
    <style>
        /* 页面基础样式：居中布局 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        /* 时钟容器 */
        .clock {
            width: 300px;
            height: 300px;
            background-color: #fff;
            border-radius: 50%;
            border: 15px solid #333;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        /* 指针公共样式 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center; /* 旋转轴心在底部中心 */
            transform: translateX(-50%) rotate(0deg); /* 初始居中并旋转 */
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            z-index: 10;
        }

        /* 时针 */
        .hand.hour {
            width: 8px;
            height: 80px;
            background-color: #333;
            margin-left: -4px; /* 修正居中偏移 */
        }

        /* 分针 */
        .hand.minute {
            width: 6px;
            height: 110px;
            background-color: #666;
            margin-left: -3px;
        }

        /* 秒针 */
        .hand.second {
            width: 2px;
            height: 130px;
            background-color: #e74c3c;
            margin-left: -1px;
            z-index: 11; /* 秒针在最上层 */
        }

        /* 中心圆点 */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background-color: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            border: 2px solid #fff;
        }

        /* 刻度样式 */
        .marker {
            position: absolute;
            width: 4px;
            height: 15px;
            background-color: #333;
            left: 50%;
            top: 10px;
            transform-origin: 50% 140px; /* 以表盘中心为轴旋转 */
            margin-left: -2px;
        }

        /* 特殊刻度（12, 3, 6, 9 点）加粗 */
        .marker.main {
            width: 8px;
            height: 20px;
            margin-left: -4px;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div class="clock">
        <!-- 刻度 (通过 JS 生成或手动写，这里为了代码简洁手动写几个主要刻度，或者用 JS 生成全部) -->
        <!-- 为了代码纯粹性，这里用 JS 动态生成刻度 -->
        
        <div class="hand hour" id="hour-hand"></div>
        <div class="hand minute" id="minute-hand"></div>
        <div class="hand second" id="second-hand"></div>
        <div class="center-dot"></div>
    </div>

    <script>
        // 获取 DOM 元素
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const clockFace = document.querySelector('.clock');

        // 动态生成 12 个刻度
        for (let i = 0; i < 12; i++) {
            const marker = document.createElement('div');
            marker.classList.add('marker');
            // 12, 3, 6, 9 点位置加粗
            if (i % 3 === 0) {
                marker.classList.add('main');
            }
            marker.style.transform = `rotate(${i * 30}deg)`;
            clockFace.appendChild(marker);
        }

        function updateClock() {
            const now = new Date();
            
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // 计算角度
            // 秒针：一圈 60 秒，每秒 6 度
            const secondsDegrees = (seconds / 60) * 360;
            
            // 分针：一圈 60 分，每分 6 度 + 秒针带来的微小偏移
            const minutesDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
            
            // 时针：一圈 12 小时，每小时 30 度 + 分针带来的偏移
            const hoursDegrees = (hours / 12) * 360 + (minutes / 60) * 30;

            // 应用旋转样式
            // 注意：这里使用了 translateX(-50%) 来保持指针水平居中，因为 left: 50% 会让指针左边缘对齐中心
            secondHand.style.transform = `translateX(-50%) rotate(${secondsDegrees}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minutesDegrees}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hoursDegrees}deg)`;
        }

        // 立即执行一次以避免延迟
        updateClock();
        
        // 每秒更新
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
